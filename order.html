<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ — MOLLY HONEY</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* สไตล์เฉพาะหน้าสั่งซื้อ */
    .order-wrap { max-width: 560px; margin: 0 auto; }
    .order-wrap .section-head { margin-bottom: var(--space-4); }
    .order-form { background: var(--white); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: var(--space-4); }
    .field .hint { margin: var(--space-1) 0 0; font-family: var(--font-ui); font-size: 0.8rem; color: var(--beige-dark); }
    .order-form .btn { margin-top: var(--space-2); }
    .order-form .btn:disabled { opacity: 0.5; cursor: wait; }
    @media (max-width: 600px) {
      .order-form { padding: var(--space-3); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">MOLLY HONEY</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="order-wrap">
        <div class="section-head">
          <h1>สั่งซื้อสินค้า</h1>
          <span class="rule" aria-hidden="true"></span>
          <p>กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="order-form">
          <div class="field">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </div>

          <div class="field">
            <label for="items">รายการสินค้า</label>
            <textarea id="items" name="items" rows="2" required></textarea>
            <p class="hint">ยังไม่ได้เลือกสินค้า? <a href="product.html" style="text-decoration: underline;">ดูสินค้าทั้งหมด</a></p>
          </div>

          <div class="field">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" step="any" inputmode="decimal" required>
          </div>

          <div class="field">
            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note"></textarea>
          </div>

          <button type="submit" class="btn btn--gold btn--block">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container center">
      <a class="brand" href="index.html">MOLLY HONEY</a>
      <p class="small" style="margin-top: var(--space-2); color: var(--beige);">© 2026 MOLLY HONEY</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
