<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ — MOLLY HONEY</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* สไตล์เฉพาะหน้าแอดมิน */
    .table-wrap {
      overflow-x: auto;
      background: var(--white);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
    }
    #ordersTable {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-family: var(--font-ui);
      font-size: 0.9rem;
      line-height: 1.6;
    }
    #ordersTable th,
    #ordersTable td {
      padding: 1rem 1.25rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line-soft);
    }
    #ordersTable thead th {
      font-weight: 500;
      color: var(--ink);
      background: var(--cream-deep);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    #ordersTable tbody td { color: var(--ink-soft); }
    #ordersTable tbody td:first-child { white-space: nowrap; }
    #ordersTable tbody tr:last-child td { border-bottom: 0; }
    #ordersTable tbody tr:hover td { background: var(--cream); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">MOLLY HONEY</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head">
        <h1>รายการสั่งซื้อ</h1>
        <span class="rule" aria-hidden="true"></span>
        <p>เรียงจากรายการล่าสุดขึ้นก่อน</p>
      </div>

      <div class="table-wrap">
        <table id="ordersTable">
          <thead>
            <tr>
              <th>วันเวลา</th>
              <th>ชื่อลูกค้า</th>
              <th>เบอร์โทร/Line</th>
              <th>รายการสินค้า</th>
              <th>จำนวนเงินรวม</th>
              <th>หมายเหตุ</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container center">
      <a class="brand" href="index.html">MOLLY HONEY</a>
      <p class="small" style="margin-top: var(--space-2); color: var(--beige);">© 2026 MOLLY HONEY</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
